[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-educational-materials"
version = "0.1.0"
description = "Seeds und synthetische Bildungsmaterialien aus offenen Vokabularen und Taxonomien"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = ["openai>=1.40", "numpy>=1.26", "rdflib>=7.0",
                "fastapi>=0.115", "uvicorn>=0.30", "jinja2>=3.1", "python-multipart>=0.0.9", "markdown-it-py>=3.0"]

[project.optional-dependencies]
mapping = ["sentence-transformers>=3.0"]  # lokale Embeddings für die Mapping-Schritte
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["sem*"]

[tool.setuptools.package-data]
"sem.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
