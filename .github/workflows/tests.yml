# Tests, Lint und Doku-Abgleich bei jedem Push und Pull Request. Läuft wie ein frischer Klon ohne data/lokal/;
# die Tests, die lokale Daten brauchen, werden übersprungen.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # scripts/doku_paare.py vergleicht den Stand der Doku über die Git-Historie
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"  # ohne sentence-transformers: die Tests rechnen keine Embeddings
      - run: ruff check --select F,B006,B008 sem tests app.py scripts
      - run: pytest -q -rs
      - run: python scripts/doku_paare.py
      - run: python scripts/i18n_texte.py
